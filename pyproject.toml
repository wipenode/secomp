[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secomp"
version = "0.1.0"
description = "Multi-cloud compliance tool for AWS, Azure, and GCP with AI-driven risk assessment"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Secomp Team", email = "team@secomp.dev"}
]
maintainers = [
    {name = "Secomp Team", email = "team@secomp.dev"}
]
keywords = ["cybersecurity", "compliance", "gdpr", "aws", "azure", "gcp", "s3", "blob", "storage", "risk-assessment", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.9"
dependencies = [
    "boto3==1.34.19",
    "click==8.1.7",
    "rich==13.7.0",
    "pydantic>=2.5.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==7.4.3",
    "moto==5.0.0",
    "pytest-mock==3.12.0",
]
azure = [
    "azure-storage-blob==12.19.0",
    "azure-identity==1.25.1",
]
gcp = [
    "google-cloud-storage==2.14.0",
]
all = [
    "azure-storage-blob==12.19.0",
    "azure-identity==1.25.1",
    "google-cloud-storage==2.14.0",
    "pytest==7.4.3",
    "moto==5.0.0",
    "pytest-mock==3.12.0",
]

[project.scripts]
secomp = "secomp.secomp.cli:cli"

[project.urls]
Homepage = "https://github.com/wipenode/secomp"
Documentation = "https://github.com/wipenode/secomp#readme"
Source = "https://github.com/wipenode/secomp"
Tracker = "https://github.com/wipenode/secomp/issues"
Discussions = "https://github.com/wipenode/secomp/discussions"

[tool.setuptools]
packages = ["secomp.secomp"]
include-package-data = true

[tool.setuptools.package-data]
"secomp.secomp" = ["*.txt", "*.md", "*.yml", "*.yaml", "*.py"]

[tool.black]
line-length = 127
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 127

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["secomp"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
