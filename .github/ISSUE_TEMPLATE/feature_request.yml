name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What problem are you trying to solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work?
      placeholder: I think Secomp should...
    validations:
      required: true

  - type: dropdown
    id: cloud_provider
    attributes:
      label: Cloud Provider
      description: Which cloud provider(s) would this feature affect?
      options:
        - AWS
        - Azure
        - GCP
        - All providers
        - CLI/UI only
        - Backend only
    validations:
      required: true

  - type: dropdown
    id: feature_type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - New cloud provider support
        - New compliance framework
        - CLI enhancement
        - API enhancement
        - Performance improvement
        - Security enhancement
        - Documentation
        - Testing
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I could also use...

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Provide examples of how this feature would be used
      placeholder: |
        ```bash
        # Example usage
        secomp scan --cloud aws --compliance gdpr --new-feature
        ```

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other context or screenshots that might help

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for similar features
          required: true
        - label: I have checked the roadmap for planned features
          required: true
        - label: I would be willing to contribute this feature
          required: false
